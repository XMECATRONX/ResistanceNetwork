<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- lattice nodes -->
  <g opacity="0.5" stroke="#a78bfa" stroke-width="1" fill="none">
    <line x1="120" y1="120" x2="220" y2="180"/>
    <line x1="220" y1="180" x2="180" y2="300"/>
    <line x1="180" y1="300" x2="300" y2="260"/>
    <line x1="300" y1="260" x2="340" y2="380"/>
    <line x1="220" y1="180" x2="340" y2="140"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="120" cy="120" r="5"/>
    <circle cx="220" cy="180" r="5"/>
    <circle cx="180" cy="300" r="5"/>
    <circle cx="300" cy="260" r="5"/>
    <circle cx="340" cy="380" r="5"/>
    <circle cx="340" cy="140" r="5"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96,420)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M20 44 L20 20 L32 34 L44 20 L44 44" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- text -->
  <text x="180" y="470" font-family="'Space Grotesk', Arial, sans-serif" font-size="96" font-weight="800" fill="#f4f4f5" letter-spacing="-2">RSTN</text>
  <text x="184" y="520" font-family="'Space Grotesk', Arial, sans-serif" font-size="30" font-weight="500" fill="url(#accent)">Resistance Network</text>
  <text x="184" y="560" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa">Post-Quantum Layer 1 Blockchain</text>

  <!-- bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.8"/>
</svg>
