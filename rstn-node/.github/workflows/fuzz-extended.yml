# RSTN — Extended Fuzzing CI (24h+ runs)
#
# This workflow runs the three fuzz targets (consensus, vm, protocol) for an
# extended duration on a self-hosted runner with sufficient memory. The
# default run is 24 hours per target, configurable via the `fuzz_duration`
# input. Corpus is persisted across runs so the fuzzer accumulates coverage.
#
# Run manually (workflow_dispatch) or nightly (schedule).

name: Extended Fuzz (24h+)

on:
  schedule:
    # Nightly at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: "Fuzz duration per target (seconds). Default: 86400 (24h)"
        required: false
        default: "86400"
      targets:
        description: "Comma-separated targets to run. Default: consensus,vm,protocol"
        required: false
        default: "consensus,vm,protocol"
      rss_limit_mb:
        description: "RSS memory limit (MB). Default: 8192"
        required: false
        default: "8192"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: ["consensus", "vm", "protocol"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly + cargo-fuzz
        run: |
          rustup install nightly
          rustup default nightly
          cargo install cargo-fuzz

      - name: Restore fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: rstn-node/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target (${{ matrix.target }})
        working-directory: rstn-node
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '86400' }}
          RSS_LIMIT_MB: ${{ github.event.inputs.rss_limit_mb || '8192' }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${FUZZ_DURATION} \
            -rss_limit_mb=${RSS_LIMIT_MB} \
            -print_final_stats=1 \
            -print_pcs=1

      - name: Minimize corpus
        working-directory: rstn-node
        if: always()
        run: |
          cargo +nightly fuzz cmin ${{ matrix.target }} || true

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rstn-node/fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: rstn-node/fuzz/artifacts
          retention-days: 90

      - name: Check for regressions
        working-directory: rstn-node
        if: always()
        run: |
          # Replay any crashes found against the current build to confirm
          # they are real (not flaky) before opening an issue.
          if [ -d fuzz/artifacts/${{ matrix.target }}/crash-* ]; then
            echo "::error::Fuzz crashes found for ${{ matrix.target }}"
            for crash in fuzz/artifacts/${{ matrix.target }}/crash-*; do
              echo "Replaying $crash..."
              cargo +nightly fuzz run ${{ matrix.target }} "$crash" || true
            done
            exit 1
          fi
          echo "No crashes found for ${{ matrix.target }}"
