[package]
name = "rstn-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# M5: `debug-rpc` enables the `rstn_debugSendTx` method, which signs
# arbitrary transactions with the node's validator keypair. It is a
# critical security hole in production (an attacker could craft txs
# signed by the validator), so it is compiled OUT of release builds by
# default. Enable it explicitly only for dev/testnet binaries:
#   `cargo build --features rstn-rpc/debug-rpc`
default = []
debug-rpc = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
rstn-core.workspace = true
rstn-crypto.workspace = true
rstn-storage.workspace = true
rstn-vm.workspace = true
rstn-bridge.workspace = true
rstn-sol-transpiler = { path = "../rstn-sol-transpiler" }
hex.workspace = true
sha3.workspace = true
chrono = "0.4"
