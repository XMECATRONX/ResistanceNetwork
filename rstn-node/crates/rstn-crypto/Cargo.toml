[package]
name = "rstn-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha3.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-big-array = "0.5"
thiserror.workspace = true
zeroize.workspace = true
rand = "0.8"
hex = "0.4"
# Post-quantum signatures (NIST FIPS 204 -- ML-DSA-65 / Dilithium3 standard)
fips204 = { workspace = true }
# Post-quantum SPHINCS+ signatures (NIST FIPS 205 -- SLH-DSA standard)
slh-dsa = { workspace = true }
# Post-quantum KEM (NIST FIPS 203 -- Kyber768 / ML-KEM-768)
pqc_kyber = { workspace = true }
# Classical ECDH for hybrid key exchange (defense in depth)
x25519-dalek = { workspace = true }
# Classical Ed25519 signatures for hybrid Dilithium3 + Ed25519 scheme (3.x)
ed25519-dalek = { workspace = true }
# Signature traits (Verify/Sign) — slh-dsa 0.2 and ed25519-dalek 3.x both use
# signature 3.0. `use signature::Verifier;` in verify_sphincs_signature() and
# `use ed25519_dalek::Verifier;` in verify_hybrid_signature() both resolve to
# the same 3.0 trait.
signature = "3.0"
# HKDF for proper key derivation
hkdf = { workspace = true }
rand_core = { workspace = true }
